<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1F2933; margin: 0; padding: 10px 14px; height: 100vh; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .top h2 { font-size: 18px; margin: 0 6px; min-width: 160px; text-align: center; }
  button { font: inherit; font-weight: 600; padding: 5px 11px; border-radius: 8px; border: 1px solid #C9D2DC; background: #fff; cursor: pointer; }
  button:hover { background: #F2F5F8; }
  button.arrow { font-size: 16px; padding: 3px 11px; }
  .sum { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .tile { border: 1px solid #E1E7ED; border-radius: 8px; padding: 3px 10px; background: #FAFBFC; }
  .tile b { display: block; font-size: 14px; }
  .tile span { font-size: 11px; color: #5F6B7A; }
  .main { flex: 1; display: flex; gap: 12px; min-height: 0; }
  .grid { flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) 124px; grid-auto-rows: 1fr; gap: 3px; min-width: 0; }
  .wk { border: 1px solid #E1E7ED; border-radius: 6px; padding: 3px 6px; background: #FAFBFC; font-size: 11px; line-height: 1.35; overflow: hidden; }
  .wk.cur { border: 2px solid #17324D; background: #EEF3F8; }
  .wk .h { font-weight: 700; color: #5F6B7A; margin-bottom: 1px; }
  .wk .l { display: flex; justify-content: space-between; gap: 4px; color: #5F6B7A; white-space: nowrap; }
  .wk .l b { color: #1F2933; }
  .wk .l.due b { color: #7A1A12; }
  .wk .l.in b { color: #1E5434; }
  .grid .wd { font-size: 11px; font-weight: 700; color: #5F6B7A; text-align: center; padding: 2px 0; }
  .grid.head { flex: 0 0 auto; grid-auto-rows: auto; margin-bottom: 3px; }
  .gridwrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .cell { border: 1px solid #E1E7ED; border-radius: 6px; padding: 3px 4px; overflow: hidden; cursor: pointer; background: #fff; min-height: 0; }
  .cell.out { background: #F7F9FA; border-color: #F0F2F4; cursor: default; }
  .cell.adj { background: #F7F9FA; }
  .cell.adj .n { color: #8A96A3; }
  .cell.today { border: 2px solid #17324D; }
  .cell.sel { background: #EEF3F8; }
  .cell .n { font-size: 11px; font-weight: 700; color: #5F6B7A; }
  .chip { font-size: 11px; line-height: 1.25; border-radius: 4px; padding: 1px 4px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid; }
  .cell .chip { display: flex; gap: 4px; }
  .chip .nm { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .chip .am { flex-shrink: 0; font-weight: 600; }
  .more { font-size: 11px; color: #5F6B7A; margin-top: 2px; }
  /* statuses */
  .s-received { background: #E3F4E8; border-color: #2E7D4F; color: #1E5434; }
  .s-expected { background: #fff; border-color: #2E7D4F; color: #1E5434; outline: 1px dashed #9CCBAE; outline-offset: -1px; }
  .s-paid { background: #EEF0F2; border-color: #8A96A3; color: #5F6B7A; }
  .s-checked { background: #E2F1F4; border-color: #1F7A8C; color: #155866; }
  .s-due { background: #EAF0F7; border-color: #17324D; color: #17324D; }
  .s-partial { background: #FFF4DB; border-color: #B7791F; color: #7A4F0E; }
  .s-late { background: #FDECEA; border-color: #B42318; color: #7A1A12; }
  .nt { opacity: .6; }
  .s-note { background: #fff; border-color: #8A96A3; color: #5F6B7A; border-left-style: dashed; }
  .s-past { background: #fff; border-color: #C9D2DC; color: #5F6B7A; }
  .side { width: 300px; display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; gap: 4px; margin-bottom: 6px; }
  .tabs button { flex: 1; font-size: 12px; }
  .tabs button.on { background: #17324D; color: #fff; border-color: #17324D; }
  .list { flex: 1; overflow-y: auto; border: 1px solid #E1E7ED; border-radius: 8px; padding: 6px; }
  .day { font-size: 12px; font-weight: 700; color: #5F6B7A; margin: 8px 2px 3px; }
  .day:first-child { margin-top: 0; }
  .item { border-radius: 6px; padding: 6px 8px; margin-bottom: 5px; border-left: 4px solid; }
  .item .row { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
  .item .st { font-size: 12px; margin-top: 1px; }
  .item .dt { font-size: 11px; color: #5F6B7A; margin-top: 2px; word-wrap: break-word; }
  .item label { display: flex; gap: 6px; align-items: center; font-size: 12px; margin-top: 4px; cursor: pointer; }
  .foot { font-size: 11px; color: #5F6B7A; margin-top: 6px; }
  .legend { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .legend .chip { display: inline-block; margin: 0; }
  .muted { color: #5F6B7A; }
  .err { color: #842029; }
  #busy { font-size: 12px; color: #5F6B7A; }
</style>
</head>
<body>
  <div class="top">
    <button class="arrow" onclick="go(-1)" title="Previous month">‹</button>
    <h2 id="title">Loading…</h2>
    <button class="arrow" onclick="go(1)" title="Next month">›</button>
    <button onclick="goToday()">This month</button>
    <span id="busy"></span>
    <div class="sum" id="sum"></div>
  </div>
  <div class="main">
    <div class="gridwrap">
      <div class="grid head"><div class="wd">Mon</div><div class="wd">Tue</div><div class="wd">Wed</div><div class="wd">Thu</div><div class="wd">Fri</div><div class="wd">Sat</div><div class="wd">Sun</div><div class="wd">Week</div></div>
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span class="chip s-received">Paycheck received</span><span class="chip s-expected">Paycheck expected</span>
        <span class="chip s-due">Bill due</span><span class="chip s-paid">✓ Paid</span><span class="chip s-checked">✓ Paid, not in tracker yet</span>
        <span class="chip s-partial">Part paid</span><span class="chip s-late">! Not seen yet</span><span class="chip s-past">Older, none found</span>
      </div>
    </div>
    <div class="side">
      <div class="tabs"><button id="tDay" onclick="setTab('day')">Selected day</button><button id="tMonth" onclick="setTab('month')">Whole month</button></div>
      <div class="list" id="list"></div>
      <div class="foot" id="foot"></div>
    </div>
  </div>
<script>var CAL_DATA = <?!= dataJson ?>;</script>
<?!= includeHtml_('CalendarMath'); ?>
<script>
  // The tables arrived with the page (CAL_DATA); every month is worked out here, so arrows and ticks are instant.
  var SRC = calReviveSource_(CAL_DATA), CHECKS = CAL_DATA.checks || {};
  var data = null, cur = null, sel = null, tab = 'month';
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(x) { if (x === null || x === undefined) return '—'; var s = Math.abs(x).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); return (x < 0 ? '−$' : '$') + s; }
  function short(x) { if (x === null || x === undefined) return ''; return '$' + Math.round(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function busy(on) { document.getElementById('busy').textContent = on ? 'Working…' : ''; }
  function fail(e) { busy(false); document.getElementById('list').innerHTML = '<p class="err">' + esc(e && e.message || e) + '</p>'; }
  function load(y, m) {
    var now = new Date();
    try { show(calendarView_(y || now.getFullYear(), m ? m - 1 : now.getMonth(), SRC, now, CHECKS)); }
    catch (e) { fail(e); }
  }
  function go(step) { if (!cur) return; var m = cur.m + step, y = cur.y; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } sel = null; load(y, m); }
  function redraw() { var keep = sel; load(cur.y, cur.m); sel = keep; renderGrid(); renderList(); }
  function goToday() { sel = null; load(); }
  function setTab(t) { tab = t; renderList(); }
  function dateOf(day) { return cur.y + '-' + ('0' + cur.m).slice(-2) + '-' + ('0' + day).slice(-2); }
  function show(d) {
    busy(false); data = d; cur = { y: d.year, m: d.month };
    document.getElementById('title').textContent = d.label;
    var ym = dateOf(1).slice(0, 7);
    var gs0 = d.gridStart.split('-'), gEnd = ymd(new Date(+gs0[0], +gs0[1] - 1, +gs0[2] + d.gridDays - 1));
    if (!sel || sel < d.gridStart || sel > gEnd) sel = d.today.slice(0, 7) === ym ? d.today : null;
    var t = d.totals;
    document.getElementById('sum').innerHTML =
      '<div class="tile"><b>' + money(t.comingIn) + '</b><span>Coming in this month (received + expected)</span></div>' +
      '<div class="tile"><b>' + money(t.stillComingIn) + '</b><span>Still coming in</span></div>' +
      '<div class="tile"><b>' + money(t.bills) + '</b><span>Bills this month' + (t.billsOnCards ? ' (' + short(t.billsOnCards) + ' on cards)' : '') + '</span></div>' +
      '<div class="tile"><b>' + money(t.stillToPay) + '</b><span>Still owe' + (t.lateCount ? ' · incl. ' + short(t.lateAmount) + ' not seen yet' : '') + '</span></div>';
    renderGrid(); renderList();
    var notes = [];
    if (t.estimates) notes.push('Amounts marked "estimate" are guesses until the real bill or paycheck arrives.');
    if (data.items.concat(data.spill || []).some(function (it) { return it.kind === 'card' || it.kind === 'carddue'; }))
      notes.push('Credit card: what you owe on the card now is a bill on your next payday, and moves on to the following payday until it is paid. Bills already charged to the card and payments already made show faded and are not counted again; the due date is a reminder.');
    if (t.billsOnCards) notes.push('Bills charged to a credit card are paid when the card is paid, not on the day shown.');
    (d.cardPayoffs || []).forEach(function (c) {
      var p = c.date.split('-'), dt = new Date(+p[0], +p[1] - 1, +p[2]);
      notes.push('Owed on ' + esc(c.name) + ': ' + money(c.amount) + (c.asOf ? ' (' + esc(c.asOf) + ')' : '') + ', due on your next payday, ' + esc(dt.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })) + '.');
    });
    if (d.past && (d.cardPayoffs || []).length) notes.push('In past months, spending on the card is not counted as bills; the card payments show as notes.');
    if (d.notShown.length) notes.push('Not on the calendar: ' + d.notShown.map(esc).join('; ') + '.');
    notes.push('Ticks you add here only mark the calendar; they change no table or total.');
    document.getElementById('foot').innerHTML = notes.join('<br>');
  }
  // This month's items, then the neighbouring months' items shown on the grid (their own month's figures).
  function all() { return data.items.concat(data.spill || []); }
  function itemsOn(date) { return all().filter(function (it) { return it.date === date; }); }
  function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function chipHtml(it) { return '<span class="nm">' + esc((it.status === 'paid' || it.status === 'checked' || it.status === 'received' ? '✓ ' : it.status === 'late' ? '! ' : '') + it.chip) + '</span><span class="am">' + esc(it.amount !== null ? short(it.amount) : '') + '</span>'; }
  // In a crowded day box, what still needs paying shows first, then pay, then what is settled or only a note.
  function chipOrder(its) {
    var rank = function (it) { return it.kind !== 'pay' && it.inTotals && /due|late|partial/.test(it.status) ? 0 : it.kind === 'pay' ? 1 : 2; };
    return its.map(function (it, i) { return { it: it, i: i }; }).sort(function (a, b) { return rank(a.it) - rank(b.it) || a.i - b.i; }).map(function (x) { return x.it; });
  }
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function renderGrid() {
    var g = document.getElementById('grid'), html = '', gs = data.gridStart.split('-'), rows = Math.ceil(data.gridDays / 7), ym = dateOf(1).slice(0, 7);
    g.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';
    for (var i = 0; i < rows * 7; i++) {
      var dt = new Date(+gs[0], +gs[1] - 1, +gs[2] + i), ds = ymd(dt), day = dt.getDate(), its = chipOrder(itemsOn(ds));
      var adj = ds.slice(0, 7) !== ym;
      var label = adj && (day === 1 || i === 0) ? MON[dt.getMonth()] + ' ' + day : String(day);
      html += '<div class="cell' + (adj ? ' adj' : '') + (ds === data.today ? ' today' : '') + (ds === sel ? ' sel' : '') + '" onclick="pick(\'' + ds + '\')"><div class="n">' + label + '</div>';
      var max = rows > 5 ? 2 : 3;
      its.slice(0, its.length > max + 1 ? max : max + 1).forEach(function (it) { html += '<div class="chip s-' + it.status + (it.inTotals ? '' : ' nt') + '" title="' + esc(it.name + ' · ' + money(it.amount) + ' · ' + it.statusText) + '">' + chipHtml(it) + '</div>'; });
      if (its.length > max + 1) html += '<div class="more">+' + (its.length - max) + ' more</div>';
      html += '</div>';
      if (i % 7 === 6) html += weekHtml(data.weeks[(i - 6) / 7]);
    }
    g.innerHTML = html;
  }
  // The total at the end of each row: that week's bills due, what is still to pay, and pay coming in.
  function weekHtml(w) {
    if (!w) return '<div class="wk"></div>';
    var line = function (label, v, cls) { return '<div class="l' + (cls ? ' ' + cls : '') + '"><span>' + label + '</span><b>' + short(v) + '</b></div>'; };
    return '<div class="wk' + (w.current ? ' cur' : '') + '" title="Monday to Sunday. Coming in: paychecks received or expected. Bills: everything due that week, including childcare and what you owe on the card. Still owe: bills not paid yet.">' +
      '<div class="h">' + (w.current ? 'This week' : 'Week') + '</div>' +
      line('Coming in', w.pay, 'in') + line('Bills', w.bills) + line('Still owe', w.stillToPay, w.stillToPay > 0 ? 'due' : '') + '</div>';
  }
  function pick(ds) { sel = ds; tab = 'day'; renderGrid(); renderList(); }
  function itemHtml(it, idx) {
    var pay = it.kind === 'pay';
    var h = '<div class="item s-' + it.status + (it.inTotals ? '' : ' nt') + '"><div class="row"><span>' + esc(it.name) + '</span><span>' + money(it.amount) + (it.estimate ? '*' : '') + '</span></div>' +
      '<div class="st">' + esc(it.statusText) + '</div>' + (it.detail ? '<div class="dt">' + esc(it.detail) + '</div>' : '');
    if (it.canCheck) h += '<label><input type="checkbox" ' + (it.checked ? 'checked ' : '') + 'onchange="tick(' + idx + ', this.checked)"> ' + (pay ? 'Received, not in the tracker yet' : 'Paid, not in the tracker yet') + '</label>';
    return h + '</div>';
  }
  function renderList() {
    document.getElementById('tDay').className = tab === 'day' ? 'on' : '';
    document.getElementById('tMonth').className = tab === 'month' ? 'on' : '';
    var el = document.getElementById('list'), html = '';
    if (tab === 'day') {
      if (!sel) { el.innerHTML = '<p class="muted">Click a day on the calendar.</p>'; return; }
      var p = sel.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]);
      html += '<div class="day">' + esc(d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })) + '</div>';
      var any = false;
      all().forEach(function (it, i) { if (it.date === sel) { any = true; html += itemHtml(it, i); } });
      if (any && sel.slice(0, 7) !== dateOf(1).slice(0, 7)) html += '<p class="muted">This day is in ' + esc(d.toLocaleDateString(undefined, { month: 'long' })) + '; its amounts count in that month\'s totals.</p>';
      if (!any) html += '<p class="muted">Nothing due or expected this day.</p>';
    } else {
      var last = '';
      data.items.forEach(function (it, i) {
        if (it.date !== last) { last = it.date; var p2 = it.date.split('-'); html += '<div class="day">' + esc(new Date(+p2[0], +p2[1] - 1, +p2[2]).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })) + '</div>'; }
        html += itemHtml(it, i);
      });
      if (!data.items.length) html = '<p class="muted">Nothing on the calendar this month.</p>';
    }
    el.innerHTML = html;
  }
  function tick(idx, on) {
    var it = all()[idx]; if (!it) return;
    var key = it.key, before = CHECKS[key];
    if (on) CHECKS[key] = 'now'; else delete CHECKS[key];
    redraw();
    document.getElementById('busy').textContent = 'Saving…';
    google.script.run
      .withSuccessHandler(function () { document.getElementById('busy').textContent = ''; })
      .withFailureHandler(function (e) {
        if (before === undefined) delete CHECKS[key]; else CHECKS[key] = before;
        redraw();
        document.getElementById('busy').innerHTML = '<span class="err">Not saved: ' + esc(e && e.message || e) + '</span>';
      })
      .setCalendarCheck(key, on);
  }
  load();
</script>
</body>
</html>
